[package]
name = "lc-plugin-host"
version = "0.2.0"
edition = "2021"
license.workspace = true
description = "Out-of-process loader for LovelyCarve plugin libraries"
publish = false

[dependencies]
lovelycarve-plugin = { path = "../sdk", default-features = false, features = ["loader"] }
serde_json = "1"

[lints.clippy]
uninlined_format_args = "warn"
