[package]
name = "lovelycarve-plugin-derive"
version = "0.2.0"
edition = "2021"
license.workspace = true
description = "Derive macro for LovelyCarve plugin record types"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[lints.clippy]
uninlined_format_args = "warn"
