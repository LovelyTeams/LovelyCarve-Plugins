[package]
name = "linuxinfo-plugin"
version = "2.0.0"
edition = "2021"
license.workspace = true
description = "LovelyCarve Linux base-information system analyzer (linuxbaseinfo)"
publish = false

[lib]
name = "linuxinfo"
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc", "std"] }
lovelycarve-plugin = { path = "../sdk" }
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
quick-xml = "0.37.5"
flate2 = "1"

[dev-dependencies]
lovelycarve-plugin = { path = "../sdk", features = ["testing"] }

[lints.rust]
# MSVC link.exe reports the import library it creates for every DLL.
linker_messages = "allow"

[lints.clippy]
uninlined_format_args = "warn"
