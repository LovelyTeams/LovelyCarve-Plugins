# Package manifest (LPP v2). Labels are the Chinese defaults; translations
# live in locales/<locale>.toml under stable keys.
id = "org.lovelycarve.linuxinfo"
name = "Linux信息"
version = "2.0.0"
protocol = 2
# linuxinfo.dll / liblinuxinfo.so, built from this crate by `just build-plugins`.
library = "linuxinfo"
memory = "1GiB"

# 基本信息分析：每个识别出的 Linux 系统运行一次，手动触发。
[[analyzer]]
id = "linuxbaseinfo"
name = "Linux基本信息"
scope = "system"
platforms = ["linux"]
trigger = "manual"
category = "baseinfo"
provides = ["timezone", "hostname", "users"]

[[analyzer.option]]
id = "items"
type = "multi"
label = "子项"
choices = [
  { id = "system_info", label = "系统信息" },
  { id = "timezone", label = "时区信息" },
  { id = "users", label = "用户列表" },
  { id = "groups", label = "用户组" },
  { id = "history", label = "历史命令" },
  { id = "logins", label = "登录信息" },
  { id = "login_failures", label = "登录失败" },
  { id = "boot_times", label = "开关机时间" },
  { id = "network", label = "网络信息" },
  { id = "usb", label = "USB使用记录" },
  { id = "services", label = "服务列表" },
  { id = "software", label = "软件信息" },
  { id = "cron", label = "定时任务" },
  { id = "autostart", label = "开机启动项" },
  { id = "recent", label = "用户痕迹" },
]
